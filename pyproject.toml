[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specforge"
version = "0.21.0"
description = "Local-first requirements engineering and specification management for software and hardware projects."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "SpecForge Contributors", email = "specforge@users.noreply.github.com"}]
keywords = ["requirements", "specification", "traceability", "engineering", "ai", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "watchdog>=4.0",
  "GitPython>=3.1",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.7"]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27", "pytest-cov>=5.0"]

[project.scripts]
specforge = "specforge_cli.main:app"
specforge-daemon = "specforge_daemon.main:main"
specforge-studio = "specforge_studio.main:main"

[project.urls]
Homepage     = "https://github.com/Monotoba/specforge"
Repository   = "https://github.com/Monotoba/specforge"
Issues       = "https://github.com/Monotoba/specforge/issues"
Changelog    = "https://github.com/Monotoba/specforge/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Monotoba/specforge/tree/main/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["specforge_*"]

[tool.setuptools.package-data]
"specforge_web" = ["*.html", "help/*.md"]
"specforge_daemon" = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]   # line length enforced by formatter, not linter

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true
